<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小型漆线雕工坊管理</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 60px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; min-height: auto; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(780px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 12px; max-height: 86vh; overflow-y: auto; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* 部件与卡点 */
    .comp { border-top: 1px dashed var(--line); padding: 7px 0; }
    .comp:first-child { border-top: 0; }
    .comp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 13px; }
    .stage { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #e3ede9; color: var(--teal); white-space: nowrap; }
    .stage.st0 { background: #e7edf4; color: #35506e; }
    .stage.st1 { background: #f3ead5; color: var(--amber); }
    .stage.st2 { background: #ece9f5; color: var(--violet); }
    .stage.st3 { background: #dfeee7; color: var(--teal); }
    .rack { font-size: 12px; }
    .blockline { font-size: 12px; line-height: 1.5; margin-top: 3px; padding-left: 2px; }
    .blockline.block { color: var(--red); }
    .blockline.warn { color: var(--amber); }
    .blockline.info { color: var(--teal); }
    .blockline::before { font-weight: 700; margin-right: 4px; }
    .blockline.block::before { content: "卡点"; }
    .blockline.warn::before { content: "注意"; }
    .blockline.info::before { content: "进度"; }
    .banner { border-radius: 7px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
    .banner.ok { background: #e2f0ea; color: #1d5c49; border: 1px solid #b7d8c8; }
    .banner.ready { background: #e6f0ef; color: var(--teal); border: 1px solid #bfd8d5; }
    .banner.void { background: #f7e7e4; color: var(--red); border: 1px solid #e2bdb8; }
    .banner .actions { margin: 6px 0 0; }
    .dsec { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfdfb; display: grid; gap: 10px; }
    .dsec h3 { margin: 0; font-size: 15px; }
    .compform { border: 1px solid var(--line); border-radius: 7px; padding: 10px; background: #fff; gap: 8px; }
    .stagebtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stagebtns button { font-size: 12px; padding: 6px 4px; min-height: auto; }
    .history { border: 1px dashed var(--line); border-radius: 7px; padding: 8px 10px; background: #fff; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
    .snapshot { color: #8a6a3a; }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2, .grid3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>小型漆线雕工坊管理</h1>
      <div class="sub">正板 / 侧板 / 纹样条分件推进：贴线 → 阴干（架位）→ 上金粉 → 合拢交付</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增整件</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">建立整件（随后登记部件）</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日阴干架位</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷部件</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干上架</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent"></div>
      <div class="actions">
        <button id="closeDialog" class="secondary" type="button">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="ui.js"></script>
</body>
</html>
