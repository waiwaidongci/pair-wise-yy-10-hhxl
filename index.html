<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小型漆线雕工坊管理</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    h4 { margin: 12px 0 6px; font-size: 14px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 60px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button:disabled { background: #9db0ab; cursor: not-allowed; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(860px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; max-height: 88vh; overflow-y: auto; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* 部件登记行（新增作品表单内） */
    .partrows { display: grid; gap: 6px; }
    .partrow { display: grid; grid-template-columns: 1.1fr 1.2fr .8fr auto auto 30px; gap: 6px; align-items: center; }
    .partrow input { padding: 7px 8px; font-size: 12px; }
    .partrow button { min-height: 30px; padding: 4px 0; }

    /* 看板卡片内的每块部件 */
    .prow { border: 1px dashed #c4d1cb; border-radius: 6px; padding: 7px; margin-top: 7px; background: #fbfdfb; }
    .prow.hasdef { border-color: #d8a3a5; background: #fdf7f7; }
    .dots { display: flex; gap: 4px; margin: 6px 0 2px; }
    .dot { font-size: 11px; padding: 3px 6px; border-radius: 99px; background: #e2ebe7; color: #5d6764; cursor: pointer; user-select: none; }
    .dot.done { background: #cfe0dd; color: #234e4b; }
    .dot.on { background: var(--teal); color: #fff; }
    .block { font-size: 12px; color: var(--red); margin-top: 4px; line-height: 1.4; }
    .block.warn { color: var(--amber); }
    .elig { font-size: 12px; margin-top: 7px; padding: 6px 8px; border-radius: 6px; line-height: 1.45; }
    .elig.ok { background: #e4f0e2; color: #23591f; }
    .elig.bad { background: #f7e6e6; color: var(--red); }
    .elig.stale { background: #f6ead2; color: var(--amber); }

    /* 详情弹窗内部件编辑 */
    .partedit { border: 1px solid var(--line); border-radius: 7px; padding: 9px; margin-bottom: 8px; background: #fbfdfb; }
    .partedit.hasdef { border-color: #d8a3a5; background: #fdf7f7; }
    .pe-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pe-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0; }
    .dialog-body .pe-grid input, .dialog-body .pe-grid select { padding: 7px 8px; font-size: 12px; }
    .dialog-body > .pe-grid { grid-template-columns: repeat(4, 1fr); }
    .inline { display: grid; grid-template-columns: 1fr auto; gap: 7px; margin-top: 6px; }
    .inline button { min-height: 34px; }
    .archive { border: 1px solid #e3d6b8; background: #fdf8ec; border-radius: 7px; padding: 8px 9px; margin-bottom: 7px; font-size: 13px; }
    .logs { max-height: 140px; overflow-y: auto; margin-top: 6px; }
    .checklist { margin: 6px 0; }

    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .partrow { grid-template-columns: 1fr 1fr; }
      .pe-grid, .dialog-body > .pe-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>小型漆线雕工坊管理</h1>
      <div class="sub">按部件推进：正板、侧板、纹样条各自贴线、阴干、上金粉；全部完成方可合拢交付</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品 · 登记部件</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option selected>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <label>每块登记：名称、尺寸、阴干架位、阴干起止时段
          <div id="partRows" class="partrows"></div>
        </label>
        <button type="button" id="addPartRow" class="secondary">+ 再加一块部件</button>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊（含各部件登记）</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日阴干中部件</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干起始</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent"></div>
      <div class="actions">
        <button id="closeDialog" class="secondary">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
